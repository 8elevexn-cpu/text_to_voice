<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字轉語音下載器</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-pink-50 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white/80 backdrop-blur-md shadow-xl rounded-2xl border border-slate-100 p-6 md:p-8 transition-all">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-200 mb-3 text-2xl">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">文字轉語音下載器</h1>
            <p class="text-sm text-slate-500 mt-1">輸入文字、調整語音風格，即可線上播放並下載 WAV 音檔。</p>
        </div>

        <!-- App Form Controls -->
        <div class="space-y-4">
            <!-- Textarea -->
            <div>
                <label for="text-input" class="block text-sm font-medium text-slate-700 mb-1">輸入要轉換的文字：</label>
                <textarea id="text-input" rows="5" class="w-full rounded-xl border border-slate-200 p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-slate-700 text-sm shadow-sm transition-all" placeholder="請在此輸入想要轉換成語音的文字內容..."></textarea>
            </div>

            <!-- Options Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Voice Selection -->
                <div>
                    <label for="voice-select" class="block text-sm font-medium text-slate-700 mb-1">選擇語音與風格：</label>
                    <select id="voice-select" class="w-full rounded-xl border border-slate-200 p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm">
                        <option value="Kore">Kore (堅定自然)</option>
                        <option value="Zephyr">Zephyr (明亮)</option>
                        <option value="Puck">Puck (活潑)</option>
                        <option value="Charon">Charon (專業沉穩)</option>
                        <option value="Fenrir">Fenrir (熱情)</option>
                        <option value="Leda">Leda (年輕)</option>
                    </select>
                </div>
                <!-- Language Selection -->
                <div>
                    <label for="lang-select" class="block text-sm font-medium text-slate-700 mb-1">語言 / 口音：</label>
                    <select id="lang-select" class="w-full rounded-xl border border-slate-200 p-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm">
                        <option value="zh-TW">繁體中文 (台灣)</option>
                        <option value="en-US">英文 (美國)</option>
                        <option value="ja-JP">日文 (日本)</option>
                        <option value="ko-KR">韓文 (韓國)</option>
                    </select>
                </div>
            </div>

            <!-- Custom Prompt Direction (Optional tone hint) -->
            <div>
                <label for="tone-prompt" class="block text-sm font-medium text-slate-700 mb-1">語氣與情感提示 (選填)：</label>
                <input type="text" id="tone-prompt" class="w-full rounded-xl border border-slate-200 p-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm" placeholder="例如：以歡快且溫柔的語氣說... (留空則使用預設)">
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button id="generate-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span>開始合成語音</span>
                </button>
                <button id="download-btn" disabled class="flex-1 bg-slate-100 text-slate-400 font-medium py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2 cursor-not-allowed">
                    <i class="fa-solid fa-download"></i> <span>下載音檔 (WAV)</span>
                </button>
            </div>
        </div>

        <!-- Status & Audio Player Area -->
        <div id="status-container" class="mt-6 hidden">
            <div id="loading-spinner" class="flex items-center justify-center space-x-2 text-indigo-600 py-3">
                <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                <span class="text-sm font-medium">正在透過 Gemini AI 進行語音合成，請稍候...</span>
            </div>
            <div id="player-box" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col gap-3">
                <div class="flex items-center justify-between text-xs text-slate-500 font-medium">
                    <span>音訊已準備就緒</span>
                    <span id="audio-duration">--:--</span>
                </div>
                <audio id="audio-player" controls class="w-full"></audio>
            </div>
        </div>

        <!-- Custom Notification Message Box -->
        <div id="msg-box" class="hidden mt-4 p-3 rounded-xl text-sm font-medium flex items-center gap-2 transition-all">
            <i id="msg-icon" class="fa-solid"></i>
            <span id="msg-text"></span>
        </div>

    </div>

    <script>
        // Helper to show custom status notification instead of alert()
        function showMessage(type, text) {
            const box = document.getElementById('msg-box');
            const icon = document.getElementById('msg-icon');
            const textEl = document.getElementById('msg-text');
            
            box.className = `mt-4 p-3 rounded-xl text-sm font-medium flex items-center gap-2 transition-all ${
                type === 'error' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
            }`;
            icon.className = type === 'error' ? 'fa-solid fa-circle-exclamation text-rose-500' : 'fa-solid fa-circle-check text-emerald-500';
            textEl.textContent = text;
            box.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('msg-box').classList.add('hidden');
        }

        // Convert base64 PCM into ArrayBuffer
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Convert raw PCM16 data to WAV Blob format
        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcm16.length * 2;
            const headerSize = 44;
            const totalSize = headerSize + dataSize;

            const buffer = new ArrayBuffer(totalSize);
            const view = new DataView(buffer);

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');

            // fmt sub-chunk
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // SubChunk1Size (16 for PCM)
            view.setUint16(20, 1, true); // AudioFormat (1 for PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);

            // data sub-chunk
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            // Write PCM samples
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        let generatedAudioUrl = null;

        document.getElementById('generate-btn').addEventListener('click', async () => {
            hideMessage();
            const textInput = document.getElementById('text-input').value.trim();
            const voiceName = document.getElementById('voice-select').value;
            const langSelect = document.getElementById('lang-select').value;
            const tonePrompt = document.getElementById('tone-prompt').value.trim();

            if (!textInput) {
                showMessage('error', '請先輸入需要轉換的文字內容！');
                return;
            }

            // Construct style instruction prompt
            let promptText = textInput;
            if (tonePrompt) {
                promptText = `Say in language ${langSelect}, with style/tone: "${tonePrompt}": ${textInput}`;
            } else {
                promptText = `Say clearly in language ${langSelect}: ${textInput}`;
            }

            const statusContainer = document.getElementById('status-container');
            const loadingSpinner = document.getElementById('loading-spinner');
            const playerBox = document.getElementById('player-box');
            const audioPlayer = document.getElementById('audio-player');
            const downloadBtn = document.getElementById('download-btn');
            const generateBtn = document.getElementById('generate-btn');

            statusContainer.classList.remove('hidden');
            loadingSpinner.classList.remove('hidden');
            playerBox.classList.add('hidden');
            downloadBtn.disabled = true;
            downloadBtn.className = "flex-1 bg-slate-100 text-slate-400 font-medium py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2 cursor-not-allowed";
            generateBtn.disabled = true;

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [{ text: promptText }]
                }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: voiceName }
                        }
                    }
                }
            };

            // Implement exponential backoff for API robustness
            let retries = 3;
            let delay = 1000;
            let response = null;

            for (let i = 0; i < retries; i++) {
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) break;
                } catch (err) {
                    // Ignore and retry
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }

            generateBtn.disabled = false;
            loadingSpinner.classList.add('hidden');

            if (!response || !response.ok) {
                showMessage('error', '語音合成失敗，請稍後再試或縮短文字長度。');
                return;
            }

            try {
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                    
                    const pcmBuffer = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmBuffer);
                    const wavBlob = pcmToWav(pcm16, sampleRate);

                    if (generatedAudioUrl) {
                        URL.revokeObjectURL(generatedAudioUrl);
                    }
                    generatedAudioUrl = URL.createObjectURL(wavBlob);

                    audioPlayer.src = generatedAudioUrl;
                    playerBox.classList.remove('hidden');

                    // Enable Download Button
                    downloadBtn.disabled = false;
                    downloadBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-md shadow-emerald-100 transition-all flex items-center justify-center gap-2 cursor-pointer";

                    showMessage('success', '語音合成成功！您可以直接線上聆聽或點擊下載按鈕。');
                } else {
                    showMessage('error', '未能正確讀取音訊回應格式。');
                }
            } catch (err) {
                showMessage('error', '解析音訊時發生錯誤。');
            }
        });

        // Handle Download
        document.getElementById('download-btn').addEventListener('click', () => {
            if (!generatedAudioUrl) return;
            const a = document.createElement('a');
            a.href = generatedAudioUrl;
            a.download = `speech_${Date.now()}.wav`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
